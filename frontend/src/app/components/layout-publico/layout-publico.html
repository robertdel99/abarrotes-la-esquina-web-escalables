<nav class="navbar navbar-expand-md bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold text-primary" routerLink="/">Abarrotes La Esquina</a>
    <button class="navbar-toggler" type="button" aria-label="Menú" (click)="onMenuClick()">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="abierto()">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="onEnlaceClick()"
            >Inicio</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/catalogo"
            routerLinkActive="active"
            (click)="onEnlaceClick()"
            >Catálogo</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/catalogo"
            [queryParams]="{ ofertas: true }"
            (click)="onEnlaceClick()"
            >Ofertas</a
          >
        </li>
      </ul>
      @if (autenticado()) {
        <a class="btn btn-primary btn-sm" [routerLink]="rutaInicio()">Ir al sistema</a>
      } @else {
        <a class="btn btn-primary btn-sm" routerLink="/login">Iniciar sesión</a>
      }
    </div>
  </div>
</nav>
<main class="container py-4">
  <router-outlet />
</main>
