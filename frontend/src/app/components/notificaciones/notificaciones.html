<div class="contenedor-toasts d-flex flex-column gap-2" aria-live="polite">
  @for (notificacion of lista(); track notificacion.id) {
    <div
      class="toast show align-items-center border-0 text-white"
      role="alert"
      [class.bg-success]="notificacion.tipo === 'exito'"
      [class.bg-danger]="notificacion.tipo === 'error'"
      [class.bg-secondary]="notificacion.tipo === 'info'"
    >
      <div class="d-flex">
        <div class="toast-body">{{ notificacion.texto }}</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Cerrar"
          (click)="onCerrarClick(notificacion.id)"
        ></button>
      </div>
    </div>
  }
</div>
